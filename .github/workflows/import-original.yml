name: Import and validate Fairway V3

on:
  push:
    paths:
      - ".github/workflows/import-original.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original app
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://github.com/ardu01/app-golf/archive/refs/heads/main.tar.gz -o /tmp/app-golf.tar.gz
          mkdir -p /tmp/src
          tar -xzf /tmp/app-golf.tar.gz -C /tmp/src --strip-components=1

      - name: Copy runtime files
        run: |
          set -euo pipefail
          rm -rf holes icons
          cp /tmp/src/index.html .
          cp /tmp/src/manifest.webmanifest .
          cp /tmp/src/sw.js .
          cp -R /tmp/src/holes .
          cp -R /tmp/src/icons .
          for f in apple-touch-icon.png icon-180.png icon-192.png icon-512.png icon-512-maskable.png icon.svg IMG_1156.png IMG_1157.png; do
            if [ -f "/tmp/src/$f" ]; then cp "/tmp/src/$f" .; fi
          done

      - name: Isolate V3 service-worker cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sw.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace('const CACHE = "fairway-v159";', 'const CACHE = "fairway-v3-160";')
          s = s.replace(
              'keys.filter((k) => k !== CACHE).map((k) => caches.delete(k))',
              'keys.filter((k) => k.startsWith("fairway-v3-") && k !== CACHE).map((k) => caches.delete(k))'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          assert len(html) > 1_000_000, len(html)
          assert "<!DOCTYPE html>" in html
          assert "navigator.serviceWorker.register" in html
          assert "const COURSES" in html
          assert "la-herreria" in html
          assert html.count("data:image") >= 18

          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          for icon in manifest.get("icons", []):
              assert Path(icon["src"]).exists(), icon["src"]

          sw = Path("sw.js").read_text(encoding="utf-8")
          assert 'fairway-v3-160' in sw
          assert 'startsWith("fairway-v3-")' in sw

          required = [
              "icons/icon-192.png",
              "icons/icon-512.png",
              "icons/apple-touch-icon.png",
          ]
          for f in required:
              assert Path(f).exists(), f

          maps = list(Path("holes").rglob("*.webp"))
          assert len(maps) >= 76, len(maps)
          print("Validation OK:", len(html), "bytes,", len(maps), "map images")
          PY

      - name: Clean development importer and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-original.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Fairway V3 from original app and isolate PWA cache"
          git push
